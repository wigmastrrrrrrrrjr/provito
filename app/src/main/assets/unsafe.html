<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provito - Blocked</title>
<style>
  :root {
    --bg: #fceef0;
    --card: #ffffff;
    --red: #d93025;
    --red-soft: #d32f2f;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    text-align: center;
  }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--red);
    color: #ffffff;
    font-size: 26px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    color: var(--red);
  }
  .msg {
    font-size: .95rem;
    line-height: 1.55;
    color: var(--text);
    max-width: 460px;
    margin-bottom: 16px;
  }
  .url {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: .75rem;
    color: var(--muted);
    word-break: break-all;
    max-width: 460px;
    margin-bottom: 24px;
  }
  button {
    display: block;
    width: 100%;
    max-width: 340px;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: .95rem;
    font-weight: 500;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform .12s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  .danger {
    background: var(--red);
    color: #ffffff;
  }
  .soft {
    background: transparent;
    color: var(--red-soft);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  .fine {
    color: var(--muted);
    font-size: .68rem;
    margin-top: 10px;
    max-width: 420px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="icon">!</div>
  <h1 id="title">UNSAFE</h1>
  <div class="msg" id="msg"></div>
  <div class="url" id="target"></div>
  <div id="actions"></div>
  <p class="fine" id="fine"></p>

<script>
var params = new URLSearchParams(location.hash.slice(1));
var level = params.get('level') || 'phishing';
var target = params.get('u') || '';

var titleEl = document.getElementById('title');
var msgEl = document.getElementById('msg');
var actions = document.getElementById('actions');
var fine = document.getElementById('fine');

document.getElementById('target').textContent = target;

function button(text, cls, handler) {
  var b = document.createElement('button');
  b.textContent = text;
  b.className = cls;
  b.addEventListener('click', handler);
  actions.appendChild(b);
}

if (level === 'malware') {
  titleEl.textContent = 'UNSAFE';
  msgEl.textContent = 'UNSAFE. You cannot view this website whatsoever. It is a completely unsafe website.';
  button('Go back', 'soft', function() { history.back(); });
  button('Open start page', 'soft', function() {
    location.href = 'provito://home';
  });
  fine.textContent = 'This site is on the malware list. There is no bypass for malware - Provito will not load it.';
} else {
  titleEl.textContent = 'WEBSITE BLOCKED';
  msgEl.textContent = "Website blocked. If you think it's safe, you can still view it below by clicking \"I continue to unsafe content\", which means you fully know that this website is unsafe and you agree that this is unsafe.";
  button('I continue to unsafe content', 'danger', function() {
    location.href = 'provito://unsafe-continue?u=' + encodeURIComponent(target);
  });
  button('Go back', 'soft', function() { history.back(); });
  fine.textContent = 'Your choice is remembered for this site only, for this session, in memory only. It is never saved to disk.';
}
</script>
</body>
</html>
