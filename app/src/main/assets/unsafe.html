<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provito - Blocked</title>
<style>
  :root {
    --bg: #1a0e0e;
    --card: #241414;
    --red: #ff5252;
    --red-soft: #b34747;
    --text: #f5ecec;
    --muted: #b09a9a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #331818 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 22px;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--red);
    color: #1a0e0e;
    font-size: 34px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.25rem; letter-spacing: 1px; margin-bottom: 14px; color: var(--red); }
  .msg { font-size: .92rem; line-height: 1.55; max-width: 460px; margin-bottom: 16px; }
  .url {
    background: var(--card);
    border: 1px solid #472a2a;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: .75rem;
    color: var(--muted);
    word-break: break-all;
    max-width: 460px;
    margin-bottom: 28px;
  }
  button {
    display: block;
    width: 100%;
    max-width: 340px;
    border: none;
    border-radius: 28px;
    padding: 14px 20px;
    font-size: .95rem;
    font-weight: 700;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform .12s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  .danger {
    background: var(--red);
    color: #1a0e0e;
  }
  .soft {
    background: transparent;
    color: var(--red-soft);
    border: 1px solid #472a2a;
    font-weight: 600;
  }
  .fine { color: var(--muted); font-size: .68rem; margin-top: 10px; max-width: 420px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="icon">!</div>
  <h1 id="title">UNSAFE</h1>
  <div class="msg" id="msg"></div>
  <div class="url" id="target"></div>
  <div id="actions"></div>
  <p class="fine" id="fine"></p>

<script>
var params = new URLSearchParams(location.search);
var level = params.get('level') || 'phishing';
var target = params.get('u') || '';

var titleEl = document.getElementById('title');
var msgEl = document.getElementById('msg');
var actions = document.getElementById('actions');
var fine = document.getElementById('fine');

document.getElementById('target').textContent = target;

function button(text, cls, handler) {
  var b = document.createElement('button');
  b.textContent = text;
  b.className = cls;
  b.addEventListener('click', handler);
  actions.appendChild(b);
}

if (level === 'malware') {
  titleEl.textContent = 'UNSAFE';
  msgEl.textContent = 'UNSAFE. You cannot view this website whatsoever. It is a completely unsafe website. You can experience phishing attacks, get your IP leaked, and more.';
  button('Go back', 'soft', function() { history.back(); });
  button('Open start page', 'soft', function() {
    location.href = 'provito://home';
  });
  fine.textContent = 'This site is on the malware list. There is no bypass for malware - Provito will not load it.';
} else {
  titleEl.textContent = 'WEBSITE BLOCKED';
  msgEl.textContent = "Website blocked. If you think it's safe, you can still view it below by clicking \"I continue to unsafe content\", which means you fully know that this website is unsafe and you agree that this is unsafe.";
  button('I continue to unsafe content', 'danger', function() {
    location.href = 'provito://unsafe-continue?u=' + encodeURIComponent(target);
  });
  button('Go back', 'soft', function() { history.back(); });
  fine.textContent = 'Your choice is remembered for this site only, for this session, in memory only. It is never saved to disk.';
}
</script>
</body>
</html>
