<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problem loading page</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f1f3f4;
    --line: #dadce0;
    --accent: #1a73e8;
    --text: #202124;
    --muted: #5f6368;
    --red: #d93025;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    text-align: center;
  }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 12px;
    max-width: 460px;
  }
  .reason {
    font-size: 1rem;
    font-weight: 500;
    color: var(--red);
    margin-bottom: 10px;
    max-width: 460px;
  }
  .hint {
    font-size: .9rem;
    line-height: 1.55;
    color: var(--muted);
    max-width: 440px;
    margin-bottom: 18px;
  }
  .url {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 15px;
    font-size: .75rem;
    color: var(--muted);
    word-break: break-all;
    max-width: 460px;
    width: 100%;
    margin-bottom: 10px;
  }
  .url:empty { display: none; }
  .code {
    font-size: .68rem;
    color: var(--muted);
    opacity: .7;
    margin-bottom: 24px;
  }
  .code:empty { display: none; }
  button {
    display: block;
    width: 100%;
    max-width: 340px;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: .95rem;
    font-weight: 500;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform .12s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  .primary { background: var(--accent); color: #ffffff; }
  .soft {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="icon">!</div>
  <h1>Hmm, we couldn&rsquo;t find that page</h1>
  <div class="reason" id="reason"></div>
  <div class="hint" id="hint"></div>
  <div class="url" id="target"></div>
  <div class="code" id="code"></div>
  <div id="actions"></div>

<script>
(function () {
  var params = new URLSearchParams(location.hash.slice(1));
  var target = params.get('u') || '';
  var reason = params.get('t') || 'The page could not be loaded';
  var hint = params.get('h') || 'Check the address and try again.';
  var code = params.get('c') || '';

  document.getElementById('reason').textContent = reason;
  document.getElementById('hint').textContent = hint;
  document.getElementById('target').textContent = target;
  document.getElementById('code').textContent = code ? 'Error code ' + code : '';

  var actions = document.getElementById('actions');
  function button(text, cls, handler) {
    var b = document.createElement('button');
    b.textContent = text;
    b.className = cls;
    b.addEventListener('click', handler);
    actions.appendChild(b);
  }

  button('Try again', 'primary', function () {
    location.href = 'provito://retry?u=' + encodeURIComponent(target);
  });
  button('Go home', 'soft', function () {
    location.href = 'provito://home';
  });
})();
</script>
</body>
</html>
