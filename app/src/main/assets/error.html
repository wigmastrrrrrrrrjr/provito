<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problem loading page</title>
<style>
  :root {
    --bg: #14141f;
    --card: #1e1e2e;
    --line: #2e2e44;
    --purple: #8e7bff;
    --text: #f3f0ff;
    --muted: #a09ab8;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1100px 560px at 50% -10%, #221f38 0%, var(--bg) 62%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 22px;
    text-align: center;
  }
  .face {
    width: 78px;
    height: 78px;
    margin-bottom: 20px;
  }
  .face .ring { fill: none; stroke: var(--purple); stroke-width: 4; opacity: .85; }
  .face .eye { fill: var(--purple); }
  .face .mouth { fill: none; stroke: var(--purple); stroke-width: 4.5; stroke-linecap: round; }
  h1 {
    font-size: 1.24rem;
    line-height: 1.35;
    margin-bottom: 12px;
    max-width: 460px;
  }
  .reason {
    font-size: 1rem;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 10px;
    max-width: 460px;
  }
  .hint {
    font-size: .9rem;
    line-height: 1.55;
    color: var(--muted);
    max-width: 440px;
    margin-bottom: 18px;
  }
  .url {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 15px;
    font-size: .74rem;
    color: var(--muted);
    word-break: break-all;
    max-width: 460px;
    width: 100%;
    margin-bottom: 10px;
  }
  .url:empty { display: none; }
  .code {
    font-size: .68rem;
    color: var(--muted);
    opacity: .7;
    margin-bottom: 26px;
  }
  .code:empty { display: none; }
  button {
    display: block;
    width: 100%;
    max-width: 340px;
    border: none;
    border-radius: 28px;
    padding: 14px 20px;
    font-size: .95rem;
    font-weight: 700;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform .12s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  .primary { background: var(--purple); color: #14141f; }
  .soft {
    background: transparent;
    color: var(--purple);
    border: 1px solid var(--line);
    font-weight: 600;
  }
</style>
</head>
<body>
  <svg class="face" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="ring" cx="50" cy="50" r="42"></circle>
    <circle class="eye" cx="37" cy="42" r="4.6"></circle>
    <circle class="eye" cx="63" cy="42" r="4.6"></circle>
    <path class="mouth" d="M34 67 Q50 55 66 67"></path>
  </svg>
  <h1>Looks like this page doesn't work</h1>
  <div class="reason" id="reason"></div>
  <div class="hint" id="hint"></div>
  <div class="url" id="target"></div>
  <div class="code" id="code"></div>
  <div id="actions"></div>

<script>
(function () {
  var params = new URLSearchParams(location.hash.slice(1));
  var target = params.get('u') || '';
  var reason = params.get('t') || 'The page could not be loaded';
  var hint = params.get('h') || 'Check the address and try again.';
  var code = params.get('c') || '';

  document.getElementById('reason').textContent = reason;
  document.getElementById('hint').textContent = hint;
  document.getElementById('target').textContent = target;
  document.getElementById('code').textContent = code ? 'Error code ' + code : '';

  var actions = document.getElementById('actions');
  function button(text, cls, handler) {
    var b = document.createElement('button');
    b.textContent = text;
    b.className = cls;
    b.addEventListener('click', handler);
    actions.appendChild(b);
  }

  button('Try again', 'primary', function () {
    location.href = 'provito://retry?u=' + encodeURIComponent(target);
  });
  button('Go home', 'soft', function () {
    location.href = 'provito://home';
  });
})();
</script>
</body>
</html>
