<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provito</title>
<style>
  :root {
    --bg: #14141f;
    --card: #1e1e2e;
    --accent: #8e7bff;
    --text: #eceaf8;
    --muted: #8f8ca6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #26263f 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .logo svg { width: 44px; height: 44px; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.5px; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  form {
    width: 100%;
    max-width: 520px;
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
  }
  input {
    flex: 1;
    min-width: 0;
    background: var(--card);
    border: 1px solid #34344f;
    border-radius: 28px;
    padding: 14px 20px;
    font-size: 1rem;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #17122e;
    border: none;
    border-radius: 28px;
    padding: 14px 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  button:hover { opacity: .85; }
  .shortcuts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 520px;
  }
  a.tile {
    background: var(--card);
    border: 1px solid #2c2c45;
    border-radius: 16px;
    padding: 16px 10px;
    text-align: center;
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    transition: transform .15s, border-color .15s;
  }
  a.tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  a.tile .dot {
    display: block;
    width: 10px; height: 10px;
    margin: 0 auto 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .note {
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
  }
  @media (min-width: 720px) {
    body { padding: 48px; }
    h1 { font-size: 2.6rem; }
    .logo svg { width: 56px; height: 56px; }
    form, .shortcuts { max-width: 640px; }
    input, button { font-size: 1.15rem; padding: 18px 26px; }
    a.tile { font-size: 1rem; padding: 22px 12px; }
    .tagline { font-size: 1rem; }
    .note { font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L4 5.5V11c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5.5L12 2z" fill="#8e7bff"/>
      <path d="M11 13l4.5-4.5 1.5 1.5L11 16l-3-3 1.5-1.5L11 13z" fill="#14141f"/>
    </svg>
    <div>
      <h1>Provito<span>.</span></h1>
      <div class="tagline">Private by default. Nothing saved, nothing sent.</div>
    </div>
  </div>

  <form action="https://search.brave.com/search" method="get">
    <input type="search" name="q" placeholder="Search privately with Brave" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>

  <div class="shortcuts">
    <a class="tile" href="https://search.brave.com"><span class="dot"></span>Brave Search</a>
    <a class="tile" href="https://wikipedia.org"><span class="dot"></span>Wikipedia</a>
    <a class="tile" href="https://github.com"><span class="dot"></span>GitHub</a>
    <a class="tile" href="https://news.ycombinator.com"><span class="dot"></span>Hacker News</a>
  </div>

  <p class="note">Trackers are blocked by Gecko's strict protection. No history, no cookies kept on exit, no telemetry.</p>
</body>
</html>
