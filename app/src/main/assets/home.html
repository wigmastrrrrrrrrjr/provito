<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provito</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f8f9fa;
    --accent: #1a73e8;
    --text: #202124;
    --muted: #5f6368;
    --border: #dadce0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .logo svg { width: 40px; height: 40px; }
  h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: 0.2px; }
  h1 span { color: var(--accent); font-weight: 400; }
  .tagline { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  form {
    width: 100%;
    max-width: 600px;
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
  }
  input {
    flex: 1;
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 12px 18px;
    font-size: 1rem;
    color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #eceff1; }
  .shortcuts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 600px;
  }
  a.tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  a.tile:hover { border-color: var(--accent); }
  a.tile .dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
  }
  .note {
    margin-top: 24px;
    color: var(--muted);
    font-size: 0.75rem;
    text-align: center;
  }
  @media (min-width: 720px) {
    body { padding: 40px; }
    h1 { font-size: 2rem; }
    .logo svg { width: 48px; height: 48px; }
    form, .shortcuts { max-width: 700px; }
    input, button { font-size: 1.1rem; padding: 14px 22px; }
    .note { font-size: 0.8rem; }
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L4 5.5V11c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5.5L12 2z" fill="#1a73e8"/>
      <path d="M11 13l4.5-4.5 1.5 1.5L11 16l-3-3 1.5-1.5L11 13z" fill="#ffffff"/>
    </svg>
    <div>
      <h1>Provito<span>.</span></h1>
      <div class="tagline">Private by default. Nothing saved, nothing sent.</div>
    </div>
  </div>

  <form action="https://search.brave.com/search" method="get">
    <input type="search" name="q" placeholder="Search or type a URL" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>

  <div class="shortcuts">
    <a class="tile" href="https://search.brave.com"><span class="dot" aria-hidden="true"></span>Brave Search</a>
    <a class="tile" href="https://wikipedia.org"><span class="dot" aria-hidden="true"></span>Wikipedia</a>
    <a class="tile" href="https://github.com"><span class="dot" aria-hidden="true"></span>GitHub</a>
    <a class="tile" href="https://news.ycombinator.com"><span class="dot" aria-hidden="true"></span>Hacker News</a>
  </div>

  <p class="note">Trackers are blocked by Gecko's strict protection. No history, no cookies kept on exit, no telemetry.</p>
</body>
</html>
