<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provito - Tabs</title>
<style>
  :root {
    --bg: #14141f;
    --card: #1e1e2e;
    --accent: #8e7bff;
    --text: #eceaf8;
    --muted: #8f8ca6;
    --border: #2c2c45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 90px;
    overflow-y: auto;
  }
  h1 { font-size: 1.1rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: .75rem; margin-bottom: 18px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .tab {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 12px 12px;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 110px;
  }
  .tab:active { transform: scale(.97); }
  .tab.current { border-color: var(--accent); }
  .tab.unloaded { opacity: .65; }
  .tab .t-title {
    font-size: .82rem;
    font-weight: 600;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .tab .t-url {
    color: var(--muted);
    font-size: .68rem;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .badge {
    margin-top: auto;
    padding-top: 8px;
    font-size: .6rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .x {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    line-height: 28px;
    text-align: center;
  }
  .x:active { color: var(--text); }
  .fab-wrap { position: fixed; bottom: 84px; left: 0; right: 0; text-align: center; }
  .fab {
    background: var(--accent);
    color: #17122e;
    border: none;
    border-radius: 28px;
    padding: 14px 26px;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
    transition: transform .12s;
  }
  .fab:active { transform: scale(.96); }
</style>
</head>
<body>
  <h1>Open tabs</h1>
  <div class="sub" id="stat">Loading...</div>
  <div class="grid" id="grid"></div>
  <div class="fab-wrap"><button class="fab" onclick="Android.newTabFromUi()">+ New tab</button></div>

<script>
function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function render() {
  var tabs;
  try { tabs = JSON.parse(Android.getTabs()); } catch (e) { tabs = []; }
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var active = tabs.filter(function(t) { return !t.unloaded; }).length;

  document.getElementById('stat').textContent =
    tabs.length + ' tab' + (tabs.length === 1 ? '' : 's') +
    ' - ' + active + ' loaded, ' + (tabs.length - active) + ' kept in standby';

  if (tabs.length === 0) {
    grid.innerHTML = '<div style="color:var(--muted);font-size:.8rem">No tabs open</div>';
    return;
  }

  tabs.forEach(function(t) {
    var card = document.createElement('div');
    card.className = 'tab' + (t.unloaded ? ' unloaded' : '') + (t.current ? ' current' : '');
    card.innerHTML =
      '<div class="t-title">' + esc(t.title) + '</div>' +
      '<div class="t-url">' + esc(t.url) + '</div>' +
      '<div class="badge">' + (t.unloaded ? 'Standby - tap to reopen' : 'Loaded') + '</div>' +
      '<button class="x" data-id="' + t.id + '">&#10005;</button>';
    card.addEventListener('click', function(ev) {
      if (ev.target.classList.contains('x')) {
        Android.close(t.id);
        setTimeout(render, 80);
      } else {
        Android.select(t.id);
      }
    });
    grid.appendChild(card);
  });
}

render();
</script>
</body>
</html>
