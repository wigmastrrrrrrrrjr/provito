name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        env:
          PROVITO_KEYSTORE_B64: ${{ secrets.PROVITO_KEYSTORE_B64 }}
          PROVITO_STORE_PASS: ${{ secrets.PROVITO_STORE_PASS }}
          PROVITO_KEY_ALIAS: ${{ secrets.PROVITO_KEY_ALIAS }}
          PROVITO_KEY_PASS: ${{ secrets.PROVITO_KEY_PASS }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gradle assembleRelease -PPROVITO_VERSION_NAME="$VERSION" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Provito-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Provito-${VERSION}.apk" \
            --title "Provito v${VERSION}" \
            --generate-notes \
            --latest
